name: Build Tweak

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP (Nếu có)
        run: |
          if [ -f "dylib" ]; then
            unzip -q dylib -d .
          elif [ -f "dylib.zip" ]; then
            unzip -q dylib.zip -d .
          fi

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Build Package
        run: |
          # Nếu giải nén ra thư mục con tên là dylib thì di chuyển vào
          if [ -d "dylib" ]; then cd dylib; fi
          make clean
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mod-FF-Deb
          path: packages/*.deb
